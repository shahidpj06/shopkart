{% load static %}

<div class="navbar">
    <div class="logo">
        <a href="{% url 'home' %}"><img src="{% static 'images/logo.png' %}" alt="logo" width="125px"></a>
    </div>
    <nav>
        <ul id="MenuItems">
            <li>
                <div class="wrap">
                    <form method="post" action="{% url 'search_product' %}">
                        {% csrf_token %}
                        <div class="search">
                        <input type="text" name="search" class="searchTerm" placeholder="What are you looking for?">
                        <button type="submit" class="searchButton">
                            <i class="fa fa-search"></i>
                        </button>
                        </div>
                    </form>
                </div>
            </li>
            <li><a href="{% url 'home' %}">Home</a></li>
            <li><a href="{% url 'list_products' %}">Products</a></li>
            {% if not user.is_authenticated %}
            <li><a href="{% url 'account_details' %}">Login</a></li>
            {% else %}
            <li><a href="{% url 'orders' %}">Orders</a></li>
            <li><a href="{% url 'cart_details' %}">My Cart</a></li>
            <li>
                <div class="dropdown">
                    <button onclick="myFunction()" class="dropbtn">Profile</button>
                    <div id="myDropdown" class="dropdown-content">
                        <a href="{% url 'edit_profile' %}">Edit Profile</a>
                        <a href="{% url 'logout' %}">Logout</a>
                    </div>
                </div>
            </li>
            {% endif %}
        </ul>
    </nav>
</div>

<script>
    function myFunction() {
        document.getElementById('myDropdown').classList.toggle("show");
    } 

    window.onclick = function(event) {
        if (!event.target.matches('.dropbtn')) {
            var dropdowns = document.getElementsByClassName("dropdown-content");
            var i;
            for (i = 0; i < dropdowns.length; i++) {
            var openDropdown = dropdowns[i];
            if (openDropdown.classList.contains('show')) {
                openDropdown.classList.remove('show');
            }
            }
        }
    }
</script>
